name: Gobus
options:
  bundleIdPrefix: com.gobus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.0"
targets:
  Gobus:
    type: application
    platform: iOS
    sources:
      - path: Gobus
      # The prebuilt schedule DB, bundled as a read-only resource and copied to
      # a writable location on first launch (see GobusServer.swift). Built by
      # `make prebuilt-db`.
      - path: ../dist/gobus.db
        buildPhase: resources
        type: file
    dependencies:
      - framework: ../build/GobusKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        INFOPLIST_FILE: Gobus/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.colindavis.gobus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device builds: auto-provision with the free personal team. The Team ID
        # is baked in so signing survives `xcodegen generate` and works headless
        # from the command line (xcodebuild -allowProvisioningUpdates creates the
        # cert + profile). Simulator builds pass CODE_SIGNING_ALLOWED=NO and
        # ignore this.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KKLTANHU6N
